name: Pruebas simuladas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulado:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Proveedores simulados con page.route: no usa claves ni hace llamadas reales.
      - run: npm test
